services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{if(!t.includes('/src/main.jsx'))throw new Error('Frontend source entry missing')}).catch(e=>{console.error(e);process.exit(1)})"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  node_modules:
